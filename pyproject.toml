[project]
name = "db-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "NeilSinclair", email = "neil.ian.sinclair@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
db-ml = "db_ml:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
